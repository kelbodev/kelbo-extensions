<div class="cp">
  <section class="cp-picker">
    <div class="cp-sv" data-role="sv" tabindex="0" data-i18n-title="picker.svTitle">
      <div class="cp-sv-thumb" data-role="sv-thumb"></div>
    </div>
    <input class="cp-range cp-hue" type="range" min="0" max="360" step="1" data-role="hue" data-i18n-title="picker.hue">
    <input class="cp-range cp-alpha" type="range" min="0" max="100" step="1" data-role="alpha" data-i18n-title="picker.alpha">
    <div class="cp-current">
      <div class="cp-swatch cp-checker"><div data-role="swatch"></div></div>
      <input class="form-input cp-input" data-role="input" spellcheck="false" autocomplete="off" data-i18n-placeholder="picker.inputPlaceholder">
      <button class="btn btn-ghost btn-sm" data-action="eyedropper" data-i18n-title="picker.eyedropper"><i data-icon="pipette"></i></button>
    </div>
    <div class="cp-formats" data-role="formats"></div>
    <div class="cp-recent-title" data-i18n="picker.recent"></div>
    <div class="cp-recent" data-role="recent"></div>
  </section>
  <section class="cp-tools">
    <div class="cp-tabs" role="tablist">
      <button class="cp-tab" data-tab="shades"><i data-icon="blend"></i> <span data-i18n="tab.shades"></span></button>
      <button class="cp-tab" data-tab="contrast"><i data-icon="contrast"></i> <span data-i18n="tab.contrast"></span></button>
      <button class="cp-tab" data-tab="palettes"><i data-icon="swatch-book"></i> <span data-i18n="tab.palettes"></span></button>
      <button class="cp-tab" data-tab="project"><i data-icon="scan-search"></i> <span data-i18n="tab.project"></span></button>
    </div>
    <div class="cp-tab-body" data-role="tab"></div>
  </section>
</div>
