<div class="term" data-role="root">
  <div class="term-notice" data-role="notice" hidden></div>
  <div class="term-bar">
    <div class="term-tabs" data-role="tabs" role="tablist"></div>
    <button class="btn btn-ghost btn-sm" data-action="new" data-i18n-title="newTitle"><i data-icon="plus"></i></button>
    <span class="term-spacer"></span>
    <button class="btn btn-ghost btn-sm" data-action="font-down" data-i18n-title="fontDown"><i data-icon="a-arrow-down"></i></button>
    <button class="btn btn-ghost btn-sm" data-action="font-up" data-i18n-title="fontUp"><i data-icon="a-arrow-up"></i></button>
    <button class="btn btn-ghost btn-sm" data-action="clear" data-i18n-title="clearTitle"><i data-icon="eraser"></i></button>
  </div>
  <div class="term-area" data-role="area"></div>
  <div class="empty-state" data-role="empty" hidden>
    <div class="icon"><i data-icon="square-terminal"></i></div>
    <p data-i18n="empty"></p>
    <button class="btn btn-primary btn-sm" data-action="new"><i data-icon="plus"></i> <span data-i18n="newHome"></span></button>
  </div>
</div>
